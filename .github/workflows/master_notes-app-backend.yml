name: Build and deploy Node.js app to Azure Web App - notes-app-backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install and build React frontend
      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build React app
        working-directory: client
        run: npm run build

      # Copy React build to server
      - name: Copy React build to backend
        run: |
          rm -rf server/build
          cp -r client/build server/

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: server
        run: npm install

      # Zip backend folder
      - name: Archive backend for deployment
        run: |
          cd server
          zip -r ../app.zip . -x "*.git*" -x "*node_modules*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
