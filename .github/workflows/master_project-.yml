name: Build and deploy Node.js app to Azure Web App - NotesApp

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 📦 Install frontend dependencies
        working-directory: client
        run: npm install

      - name: 🏗️ Build frontend
        working-directory: client
        run: npm run build

      - name: 📁 Copy React build to backend
        run: |
          rm -rf server/build
          cp -r client/build server/

      - name: 📦 Install backend dependencies
        working-directory: server
        run: npm install

      - name: 📦 Zip server code for deployment
        run: |
          cd server
          zip -r ../app.zip . -x "*.git*" -x "*node_modules*"

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'project--c2bdbrbgh2axaeae'  # ✅ Replace with your actual App Name
          slot-name: 'Production'
          package: app.zip
