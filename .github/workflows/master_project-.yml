name: Build and deploy Node.js app to Azure Web App - Project-

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Upload server folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: server

      - name: Install server dependencies (again for deploy environment)
        working-directory: server
        run: npm install --omit=dev

      - name: Zip server folder for deployment
        run: |
          cd server
          zip -r ../server.zip . -x "*.git*" -x "*node_modules*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
