name: Build and deploy Node.js app to Azure Web App - Project

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        run: npm run build

      - name: Copy React build to server folder
        run: |
          rm -rf server/build
          cp -r client/build server/

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Upload server folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: server

      - name: Install server dependencies (again)
        working-directory: server
        run: npm install --omit=dev

      - name: Zip server folder for deployment
        run: |
          cd server
          zip -r ../server.zip . -x "*.git*" -x "*node_modules*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EC47BD4FD2C4FD885FB177C91B097D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1F9C0D29229E414C837FB9D9D2BF4567 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_89CC7CDB08CA405281F65BFE24CBF5C0 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'project-notesapp'  # 🔁 REPLACE with your actual App Service name
          slot-name: 'Production'
          package: server.zip
